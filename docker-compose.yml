services:
  cursor-gateway:
    image: ${CURSOR_GATEWAY_IMAGE:-cursor-gateway:local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CURSOR_DIRECT_PORT:-8790}:8790"
    volumes:
      - ./data:/data
    environment:
      CURSOR_DIRECT_HOST: 0.0.0.0
      CURSOR_DIRECT_PORT: 8790
      CURSOR_DIRECT_AUTH_FILE: /data/accounts.json
      CURSOR_DIRECT_API_KEY: ${CURSOR_DIRECT_API_KEY:-}
      CURSOR_DIRECT_BASE_URL: ${CURSOR_DIRECT_BASE_URL:-https://api2.cursor.sh}
      CURSOR_DIRECT_MODEL_PREFIX: ${CURSOR_DIRECT_MODEL_PREFIX-}
      CURSOR_ALLOWED_NATIVE_TOOLS: ${CURSOR_ALLOWED_NATIVE_TOOLS:-mcp_tool_call}
      CURSOR_DIRECT_PROXY_URL: ${CURSOR_DIRECT_PROXY_URL:-}
      CURSOR_DIRECT_CLIENT_VERSION: ${CURSOR_DIRECT_CLIENT_VERSION:-cli-2026.08.11-e8db854}
      CURSOR_DIRECT_TIMEOUT_MS: ${CURSOR_DIRECT_TIMEOUT_MS:-300000}
      CURSOR_DIRECT_SYSTEM_AS_HISTORY: ${CURSOR_DIRECT_SYSTEM_AS_HISTORY:-true}
      CURSOR_DIRECT_REPLAY_REASONING: ${CURSOR_DIRECT_REPLAY_REASONING:-true}
      CURSOR_DIRECT_REASONING_REPLAY_MAX_CHARS: ${CURSOR_DIRECT_REASONING_REPLAY_MAX_CHARS:-12000}
      CURSOR_DIRECT_TOOL_INPUT_RETRIES: ${CURSOR_DIRECT_TOOL_INPUT_RETRIES:-1}
      CURSOR_DIRECT_REUSE_SESSIONS: ${CURSOR_DIRECT_REUSE_SESSIONS:-true}
      CURSOR_DIRECT_SESSION_KEEPALIVE_SECONDS: ${CURSOR_DIRECT_SESSION_KEEPALIVE_SECONDS:-300}
      CURSOR_DIRECT_SESSION_MAX_ENTRIES: ${CURSOR_DIRECT_SESSION_MAX_ENTRIES:-8}
      CURSOR_DIRECT_CONTINUATION_PROMPT: ${CURSOR_DIRECT_CONTINUATION_PROMPT:-Continue, using the tool results above.}
      CURSOR_DIRECT_LOG_REQUESTS: ${CURSOR_DIRECT_LOG_REQUESTS:-true}
      CURSOR_DIRECT_MAX_BODY_BYTES: ${CURSOR_DIRECT_MAX_BODY_BYTES:-67108864}
      CURSOR_DIRECT_RESPONSE_CACHE_TTL: ${CURSOR_DIRECT_RESPONSE_CACHE_TTL:-3600}
      CURSOR_DIRECT_RESPONSE_CACHE_ENTRIES: ${CURSOR_DIRECT_RESPONSE_CACHE_ENTRIES:-256}
      CURSOR_DIRECT_RESPONSE_CACHE_BYTES: ${CURSOR_DIRECT_RESPONSE_CACHE_BYTES:-134217728}
