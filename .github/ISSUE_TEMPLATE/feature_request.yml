name: Feature request / 功能建议
description: Describe a use case and the behavior you would like to see.
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 替代方案
