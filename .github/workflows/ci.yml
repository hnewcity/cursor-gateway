name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks and packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
      - name: Run automated tests
        run: python -m pytest -q
      - name: Check dependencies and build distributions
        run: |
          python -m pip check
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose and build runtime
        env:
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker compose config --quiet
          docker build --target runtime \
            --build-arg "VCS_REF=${REVISION}" \
            --build-arg "SOURCE_URL=${SOURCE_URL}" \
            --tag cursor-gateway:ci .
      - name: Verify health and API schema
        run: |
          set -eu
          container="$(docker run --detach cursor-gateway:ci)"
          trap 'docker rm --force --volumes "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container" python3.14 -c '
          import json, urllib.request
          base = "http://127.0.0.1:8790"
          assert json.load(urllib.request.urlopen(base + "/health", timeout=3))["ok"]
          schema = json.load(urllib.request.urlopen(base + "/openapi.json", timeout=3))
          assert "/v1/chat/completions" in schema["paths"]
          assert "/v1/responses" in schema["paths"]
          ' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

  secrets:
    name: Scan Git history for credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified Gitleaks binary
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'
